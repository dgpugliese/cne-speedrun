<style>
/* ==============================================================
   ULTRA-MINIMAL LINEAR / TODOIST CHECKLIST SYSTEM
   ============================================================== */
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --hover: #f4f4f5;
  --subtle: #e4e4e7;
  --border: #e4e4e7;
  --fg: #18181b;
  --fg-2: #52525b;
  --muted: #71717a;

  --primary: #0d9488;
  --primary-soft: rgba(13, 148, 136, 0.1);
  --accent: #6366f1;
  --accent-soft: rgba(99, 102, 241, 0.1);
  --good: #16a34a;
  --good-soft: rgba(22, 163, 74, 0.1);
  --warn: #d97706;
  --warn-soft: rgba(217, 119, 6, 0.1);

  --font: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
}

html[data-theme="dark"] {
  --bg: #0b0d11;
  --surface: #12151c;
  --hover: #181c26;
  --subtle: #222734;
  --border: #1e2330;
  --fg: #f4f4f5;
  --fg-2: #a1a1aa;
  --muted: #71717a;

  --primary: #2dd4bf;
  --primary-soft: rgba(45, 212, 191, 0.12);
  --accent: #818cf8;
  --accent-soft: rgba(129, 140, 248, 0.14);
  --good: #4ade80;
  --good-soft: rgba(74, 222, 128, 0.12);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.12);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 13.5px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Centered Single-Column Container */
.wrap {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

/* Sticky Minimal Top Header */
.top {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 16px 0 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.top-row1 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background: #002855;
  display: grid;
  place-items: center;
  flex: none;
}
.brand-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.brand-sub {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
}

.top-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.ctrl {
  height: 26px;
  padding: 0 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg-2);
  font: 500 12px/1 var(--font);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.ctrl:hover { border-color: var(--muted); color: var(--fg); }
.ctrl input, .ctrl select {
  border: 0;
  background: transparent;
  color: var(--fg);
  font: 600 12px/1 var(--mono);
  padding: 0;
  cursor: pointer;
  outline: none;
}

/* Segmented Progress Bar */
.prog-wrap { margin: 12px 0 10px; }
.prog-stats {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  color: var(--fg-2);
  margin-bottom: 6px;
  flex-wrap: wrap;
  gap: 8px;
}
.prog-stats b { color: var(--fg); font-family: var(--mono); }
.prog-bar {
  height: 6px;
  background: var(--subtle);
  border-radius: 99px;
  display: flex;
  overflow: hidden;
  gap: 2px;
}
.prog-seg { height: 100%; transition: width 300ms ease; }

/* Flat View Filter Tabs */
.tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  padding-top: 4px;
}
.tab {
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font: 500 12.5px/1 var(--font);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: all 120ms;
}
.tab:hover { color: var(--fg); background: var(--hover); }
.tab.on {
  background: var(--fg);
  color: var(--bg);
  font-weight: 600;
}
.tab .cnt {
  font-family: var(--mono);
  font-size: 11px;
  opacity: 0.75;
}

/* ==============================================================
   PHASE SECTIONS & FORK PICKERS
   ============================================================== */
.sec { margin-bottom: 28px; }
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 4px 8px;
  border-bottom: 1px solid var(--border);
}
.sec-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sec-meta {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
}

/* Inline Fork Bar */
.fork-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  margin: 8px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  flex-wrap: wrap;
}
.fork-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-2);
  display: flex;
  align-items: center;
  gap: 6px;
}
.fork-opts {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.fork-btn {
  height: 26px;
  padding: 0 10px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg-2);
  font: 500 12px/1 var(--font);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 120ms;
}
.fork-btn:hover { border-color: var(--muted); color: var(--fg); }
.fork-btn.on {
  background: var(--primary-soft);
  color: var(--primary);
  border-color: var(--primary);
  font-weight: 600;
}

/* ==============================================================
   COMPACT CHECKLIST ROWS (LINEAR / TODOIST STYLE)
   ============================================================== */
.list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-top: 8px;
}
.row {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  transition: background 100ms;
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--hover); }

/* Checkbox Circle */
.chk {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--muted);
  background: transparent;
  cursor: pointer;
  display: inline-grid;
  place-items: center;
  padding: 0;
  color: transparent;
  transition: all 120ms;
}
.chk:hover { border-color: var(--primary); }
.row.done .chk {
  background: var(--good);
  border-color: var(--good);
  color: #fff;
}
.chk svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.5; fill: none; }

.r-main {
  min-width: 0;
  cursor: pointer;
}
.r-line1 {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.r-title {
  font-weight: 500;
  color: var(--fg);
}
.row.done .r-title {
  text-decoration: line-through;
  color: var(--muted);
}
.r-sub {
  font-size: 12px;
  color: var(--muted);
}
.r-detail {
  font-size: 12px;
  color: var(--fg-2);
  margin-top: 4px;
  padding-top: 4px;
  border-top: 1px dashed var(--border);
  display: none;
}
.row.open .r-detail { display: block; }

.r-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
}

/* Micro Pills */
.pill {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--hover);
  color: var(--fg-2);
  white-space: nowrap;
}
.pill.fast { background: var(--good-soft); color: var(--good); }
.pill.touch { background: var(--accent-soft); color: var(--accent); }
.pill.cu { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.pill.pay { background: var(--good-soft); color: var(--good); font-weight: 600; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

/* Sub-group headers inside a phase */
.sub-lbl {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  padding: 12px 4px 4px;
  display: flex;
  justify-content: space-between;
}

/* Minimal Footer */
footer {
  margin-top: 40px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
  flex-wrap: wrap;
  gap: 8px;
}
.f-btns { display: flex; gap: 8px; }
.f-btn {
  border: 0;
  background: none;
  color: var(--muted);
  font: 500 12px/1 var(--font);
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 4px;
}
.f-btn:hover { color: var(--fg); background: var(--hover); }

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--fg);
  color: var(--bg);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 500;
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: all 150ms;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 600px) {
  .row { grid-template-columns: 24px minmax(0, 1fr); }
  .r-right { grid-column: 2; justify-self: start; margin-top: 2px; }
}
</style>
</head>

/* ==============================================================
   DATA

/* ==============================================================
   CALCULATIONS
   ============================================================== */
const credById = id => CREDS.find(c => c.id === id);
function credOK(c, startIso) {
  if (c.inProgress) return { ok:true };
  const start = new Date(startIso + "T00:00");
  if (c.kind === "cert" && addYears(c.issued, 5) < start) return { ok:false };
  if (c.exp && new Date(c.exp + "T00:00") < start) return { ok:false };
  return { ok:true };
}
function coursesFor(track) {
  return COURSES.filter(c => c.tr[track]).map(c => ({ ...c, cu:c.tr[track][0], term:c.tr[track][1] }));
}
function statusOf(c) {
  if (S.status[c.id]) return { s:S.status[c.id] };
  const ip = c.sat.map(credById).filter(Boolean).find(cr => cr.inProgress);
  const hit = c.sat.map(credById).filter(Boolean).find(cr => !cr.inProgress && credOK(cr, S.start).ok);
  if (hit) return { s:"transfer", by:hit };
  if (ip || c.sophia) return { s:"sophia" };
  return { s:"todo" };
}

const SPEED_ORDER = ["itf","itapps","vc","bizit","linux","networks","netseca","cloudapps","netan","telecomm","virt","cnsm",
  "iot","python","pyauto","sdn","netauto","devnet","ai","hybrid","azfund","awsfound","ccna","cyberops","azplat","azarch","awsarch","awsops","ethics","systems","techcomm","comp","physsci","hfw","algebra","ushist","visual","capstone"];

function chkSvg() {
  return `<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function rowHtml({ key, done, toggleAttr, title, sub, pills = [], tip }) {
  const isOpen = !!S.open[key];
  return `<div class="row ${done ? "done" : ""} ${isOpen ? "open" : ""}" data-row="${key}">
    <button type="button" class="chk" ${toggleAttr} aria-label="Toggle ${title}">${chkSvg()}</button>
    <div class="r-main" data-expand="${key}">
      <div class="r-line1">
        <span class="r-title">${title}</span>
        ${sub ? `<span class="r-sub">${sub}</span>` : ""}
      </div>
      ${tip ? `<div class="r-detail">${tip}</div>` : ""}
    </div>
    <div class="r-right">${pills.join("")}</div>
  </div>`;
}

function render() {
  const list = coursesFor(S.track);
  const sophiaQueue = list.filter(c => c.sophia).sort((a,b) => (a.order||99) - (b.order||99));
  const wguQueue = list.filter(c => !c.sophia && statusOf(c).s !== "transfer").sort((a,b) => SPEED_ORDER.indexOf(a.id) - SPEED_ORDER.indexOf(b.id));
  const bankedList = list.filter(c => !c.sophia && statusOf(c).s === "transfer").concat(list.filter(c => c.sophia && statusOf(c).s === "transfer" && !S.status[c.id]));

  let doneCU = 0, sophiaLeftCU = 0, wguLeftCU = 0;
  list.forEach(c => {
    const s = statusOf(c).s;
    if (s === "transfer" || s === "done") doneCU += c.cu;
    else if (c.sophia) sophiaLeftCU += c.cu;
    else wguLeftCU += c.cu;
  });
  const totCU = list.reduce((a,c) => a + c.cu, 0);
  const months = +S.target || 3;
  const gradDate = addMonths(new Date(S.start + "T00:00"), months);
  const perWk = (wguLeftCU / (months * 4.345)).toFixed(1);
  const road = ROADS[S.road || "sec"];

    <span>B.S. Target: <b>${fmt(gradDate)}</b> · M.S. Target: <b>${fmt(addMonths(gradDate, 6))}</b></span>
  `;
  $("#barDone").style.width = (doneCU / totCU * 100).toFixed(1) + "%";
  $("#barSophia").style.width = (sophiaLeftCU / totCU * 100).toFixed(1) + "%";

  const sophDoneCnt = sophiaQueue.filter(c => ["transfer","done"].includes(statusOf(c).s)).length;

  $("#cntWgu").textContent = `${wguDoneCnt}/${wguQueue.length}`;

  $("#cntBanked").textContent = `${doneCU} CU`;

  document.querySelectorAll("#viewTabs .tab").forEach(b => b.classList.toggle("on", b.dataset.view === S.view));

  let html = "";

  // ---- PHASE 1: SOPHIA ----
  if (S.view === "all" || S.view === "sophia") {
    const slotA = sophiaQueue.filter(c => c.slot === "A");
    const slotB = sophiaQueue.filter(c => c.slot === "B");

      const done = ["transfer","done"].includes(statusOf(c).s);

        key: "soph-" + c.id,
        done,
        toggleAttr: `data-toggle-sophia="${c.id}"`,
        title: c.sophia,
        sub: `→ ${c.t}`,
        pills: [
          `<span class="pill ${c.touch===0 ? "fast" : "touch"}">${c.touch===0 ? "0 Touchstones" : `${c.touch} Touchstone${c.touch>1?"s":""}`}</span>`,

        ],

    html += `<section class="sec">
      <div class="sec-head">
        <div class="sec-title">1. Sophia Queue — Optimized 2-Slot Order</div>
        <div class="sec-meta">${sophDoneCnt}/${sophiaQueue.length} done · Pair 1 Fast + 1 Touchstone</div>
      </div>
      <div class="sub-lbl"><span>SLOT A · FAST LANE (0 TOUCHSTONES — FINISH FIRST)</span><span>1–2 days each</span></div>
      <div class="list">${slotA.map(renderSophRow).join("")}</div>
      <div class="sub-lbl"><span>SLOT B · GRADING QUEUE (RUN 1 AT A TIME WHILE WORKING ON SLOT A)</span><span>2–4 day grading</span></div>
      <div class="list">${slotB.map(renderSophRow).join("")}</div>
    </section>`;
  }

  // ---- PHASE 2: WGU ----
  if (S.view === "all" || S.view === "wgu") {
    const sprintNames = {
      1: ["SPRINT 1 · WEEK 1–2 MOMENTUM (CERTS & MATERIAL YOU KNOW)", "Fastest CUs"],
      2: ["SPRINT 2 · CORE NETWORKING, VIRTUALIZATION & SECURITY", "Exam-heavy"],
      3: ["SPRINT 3 · PYTHON, AUTOMATION & CLOUD ARCHITECTURE", "Prereq chain"],
      4: ["SPRINT 4 · REMAINING GEN EDS & CAPSTONE WRITE-UP", `Grad ${fmt(gradDate)}`]
    };
    html += `<section class="sec">
      <div class="sec-head">
        <div class="sec-title">2. WGU Speedrun — Fastest-First Order</div>
        <div class="sec-meta">${wguLeftCU} CU left · ~${perWk} CU/wk</div>
      </div>
      <div class="fork-bar">
        <span class="fork-label">⑂ Fork 1: WGU Track</span>
        <div class="fork-opts">
          ${Object.entries(TRACKS).map(([k,v]) => `<button type="button" class="fork-btn ${S.track===k?"on":""}" data-track="${k}" title="${v.note}">${v.name} (${v.total} CU)</button>`).join("")}
        </div>
      </div>
      ${[1,2,3,4].map(sp => {
        const items = wguQueue.filter(c => (c.sprint || 2) === sp);
        if (!items.length) return "";
        return `<div class="sub-lbl"><span>${sprintNames[sp][0]}</span><span>${sprintNames[sp][1]}</span></div>
          <div class="list">${items.map(c => {
            const done = statusOf(c).s === "done";
            return rowHtml({
              key: "wgu-" + c.id,
              done,
              toggleAttr: `data-toggle-wgu="${c.id}"`,
              title: c.t,
              sub: c.area,
              pills: [
                c.cert ? `<span class="pill warn">${c.cert}</span>` : "",
                `<span class="pill cu">${c.cu} CU</span>`
              ],
              tip: c.tip
            });
          }).join("")}</div>`;
      }).join("")}
    </section>`;
  }

  // ---- PHASE 3: DHS / TEEX + CISSP ----
  if (S.view === "all" || S.view === "fed") {
    html += `<section class="sec">
      <div class="sec-head">
        <div class="sec-title">3. DHS / FEMA Training (TEEX) & Core Screening Certs</div>
        <div class="sec-meta">${fedDoneCnt}/${FED_ITEMS.length} done · Free CEUs + CISSP</div>
      </div>
      <div class="list">
        ${FED_ITEMS.map(f => {
          const done = !!(S.steps[f.id] || S.ms[f.id]);
          return rowHtml({
            key: f.id,
            done,
            toggleAttr: `data-toggle-fed="${f.id}"`,
            title: f.title,
            sub: f.sub,
            pills: [
              f.url ? `<a class="pill" href="${f.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Link ↗</a>` : "",
              `<span class="pill touch">${f.tag}</span>`
            ],
            tip: f.tip
          });
        }).join("")}
      </div>
    </section>`;
  }

  // ---- PHASE 4: POST-GRAD & ARCHITECTURE ROADMAP ----
  if (S.view === "all" || S.view === "career") {
    html += `<section class="sec">
      <div class="sec-head">
        <div class="sec-title">4. Post-Grad & Architecture Specialization</div>
        <div class="sec-meta">${road.name} · ${road.band}</div>
      </div>
      <div class="fork-bar">
        <span class="fork-label">⑂ Fork 2: Specialization</span>
        <div class="fork-opts">
          ${Object.entries(ROADS).map(([k,r]) => `<button type="button" class="fork-btn ${S.road===k?"on":""}" data-road="${k}">${r.name} <span class="mono" style="opacity:.75">${r.band}</span></button>`).join("")}
        </div>
      </div>
      <div class="list">
        ${road.items.map(x => {
          const done = !!S.ms[x.id];
          return rowHtml({
            key: x.id,
            done,
            toggleAttr: `data-toggle-ms="${x.id}"`,
            title: x.title,
            sub: x.sub,
            pills: [
              `<span class="pill">${fmt(addMonths(gradDate, x.m))}</span>`,
              `<span class="pill pay">${x.tag}</span>`
            ],
            tip: x.tip
          });
        }).join("")}
      </div>
    </section>`;
  }

  // ---- BANKED CREDITS VIEW ----
  if (S.view === "banked") {
    const bankedCourses = list.filter(c => ["transfer","done"].includes(statusOf(c).s));
    html += `<section class="sec">
      <div class="sec-head">
        <div class="sec-title">Banked & Transferred WGU Courses</div>
        <div class="sec-meta">${bankedCourses.length} courses · ${doneCU} CU</div>
      </div>
      <div class="list">
        ${bankedCourses.map(c => {
          const st = statusOf(c);
          return rowHtml({
            key: "bank-" + c.id,
            done: true,
            toggleAttr: c.sophia ? `data-toggle-sophia="${c.id}"` : `data-toggle-wgu="${c.id}"`,
            title: c.t,
            sub: st.by ? `via ${st.by.name}` : (c.sophia ? `via ${c.sophia}` : "Passed at WGU"),
            pills: [`<span class="pill cu">${c.cu} CU</span>`]
          });
        }).join("")}
      </div>
    </section>`;
  }

  $("#stream").innerHTML = html;
}

/* ==============================================================
   EVENTS
   ============================================================== */
document.addEventListener("click", async e => {
  if (e.target.closest("#themeBtn")) {
    const order = ["auto","dark","light"];
    S.theme = order[(order.indexOf(S.theme || "auto") + 1) % order.length];
    save(); applyTheme(); return;
  }
  const vBtn = e.target.closest("[data-view]");
  if (vBtn) { S.view = vBtn.dataset.view; save(); render(); return; }

  const tBtn = e.target.closest("[data-track]");
  if (tBtn) { S.track = tBtn.dataset.track; save(); render(); toast(`Switched to ${TRACKS[S.track].name} track`); return; }

  const rBtn = e.target.closest("[data-road]");
  if (rBtn) { S.road = rBtn.dataset.road; save(); render(); toast(`Switched to ${ROADS[S.road].name}`); return; }

  const sophChk = e.target.closest("[data-toggle-sophia]");
  if (sophChk) {
    const id = sophChk.dataset.toggleSophia;
    if (S.status[id] === "transfer") { delete S.status[id]; toast("Unchecked Sophia course"); }
    else { S.status[id] = "transfer"; toast("Sophia course completed ✓"); }
    save(); render(); return;
  }

  const wguChk = e.target.closest("[data-toggle-wgu]");
  if (wguChk) {
    const id = wguChk.dataset.toggleWgu;
    if (S.status[id] === "done") { delete S.status[id]; toast("Unchecked WGU course"); }
    else { S.status[id] = "done"; toast("WGU course passed ✓"); }
    save(); render(); return;
  }

  const fedChk = e.target.closest("[data-toggle-fed]");
  if (fedChk) {
    const id = fedChk.dataset.toggleFed;
    S.steps[id] = !S.steps[id];
    S.ms[id] = S.steps[id];
    save(); render(); toast(S.steps[id] ? "Completed ✓" : "Unchecked"); return;
  }

  const msChk = e.target.closest("[data-toggle-ms]");
  if (msChk) {
    const id = msChk.dataset.toggleMs;
    S.ms[id] = !S.ms[id];
    save(); render(); toast(S.ms[id] ? "Milestone completed ✓" : "Unchecked"); return;
  }

  const exp = e.target.closest("[data-expand]");
  if (exp && !e.target.closest("a")) {
    const k = exp.dataset.expand;
    S.open[k] = !S.open[k];
    save(); render(); return;
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "startDate" && e.target.value) { S.start = e.target.value; save(); render(); }
  if (e.target.id === "paceSelect") { S.target = +e.target.value; save(); render(); }
});

$("#copyResumeBtn").onclick = async () => {
  const txt = [
    "### Federal & National Training (DHS / FEMA / NTED)",
    "- AWR-351: Zero Trust for State, Local, and Federal Critical Infrastructure (FEMA/DHS)",
    "- PER-371: Cybersecurity Incident Response and Management (FEMA/DHS NTED)",
    "- AWR-138: Network Assurance (DHS National Cybersecurity Preparedness Consortium)",
    "- AWR-139: Digital Forensics Basics (DHS National Cybersecurity Preparedness Consortium)"
  ].join("\n");
  try { await navigator.clipboard.writeText(txt); toast("Copied DHS/FEMA résumé lines ✓"); } catch {}
};

$("#backupBtn").onclick = async () => {
  const txt = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  try { await navigator.clipboard.writeText(txt); toast("Backup copied ✓"); }
  catch { prompt("Copy backup:", txt); }
};
$("#restoreBtn").onclick = () => {
  const txt = prompt("Paste backup code:"); if (!txt) return;
  try { S = Object.assign({}, DEFAULTS, JSON.parse(decodeURIComponent(escape(atob(txt.trim()))))); save(); applyTheme(); render(); toast("Backup restored ✓"); }
  catch { alert("Invalid backup code."); }
};
$("#resetBtn").onclick = () => {
  if (confirm("Reset all progress?")) {
    localStorage.removeItem(KEY);
    S = JSON.parse(JSON.stringify(DEFAULTS));
    save(); applyTheme(); render(); toast("Reset complete");
  }
};

render();
</script>
</body>
</html>
